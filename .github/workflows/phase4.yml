name: phase4

on:
  workflow_dispatch:

jobs:
  similarity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: Prepare runtime dir
        run: |
          mkdir -p out
          cp data/mb2_W.npz out/
          cp data/mb2_nodes.npy out/ 2>/dev/null || true

      - name: Run phase4 similarity experiments
        run: |
          set -o pipefail
          env FLY_OUT=out python ci/phase4_similarity.py 2>&1 | tee phase4.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p p4-artifacts
          cp out/phase4_results.json p4-artifacts/ 2>/dev/null || true
          cp out/phase4_raw.npz p4-artifacts/ 2>/dev/null || true
          cp out/phase4_pairs.csv p4-artifacts/ 2>/dev/null || true
          cp phase4.log p4-artifacts/ 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-results
          path: p4-artifacts/
          if-no-files-found: warn